# flutter.hostAppProjectName tells the Flutter Gradle plugin which Gradle
# project acts as the Flutter module's "host app" for merging Flutter
# assets/AOT libraries into. The Flutter add-to-app Gradle plugin requires
# the host to be a real `com.android.application` project — it cannot
# attach directly to android_mobi_nooa (an `com.android.library` module).
# `app/` is a minimal application module that depends on android_mobi_nooa.
flutter.hostAppProjectName=app

android.useAndroidX=true
android.enableJetifier=true
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -Dfile.encoding=UTF-8
org.gradle.daemon=true
